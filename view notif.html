<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>

<body>
{% extends 'Admin/homeindex.html' %}
{% block body %}
<form id="form1" name="form1" method="post" action="/myapp/view_notif_post/#ab">
    {% csrf_token %}
<table class="table table-striped table-hover">
        <tr>
      <td><label for="textfield">From Date</label>
      <input type="date" class="form-control" required name="textfield" id="textfield" /></td>
      <td><label for="textfield2">To Date</label>
      <input type="date" class="form-control" required name="textfield2" id="textfield2" /></td>
      <td>
          <br>
          <input type="submit" class="btn btn-outline-success" name="button" id="button" value="Search" /></td>
    </tr>
    </table>
<table class="table table-striped table-hover">
  <tr>
    <td>Sl no</td>
    <td>Date</td>
    <td>Notification</td>
    <td colspan="2" class="text-center">Action</td>

  </tr>
    {% for i in data %}
  <tr>
    <td>{{ forloop.counter }}&nbsp;</td>
    <td>&nbsp;{{ i.date }}</td>

    <td>&nbsp;{{ i.notif }}</td>

         <td><a href="/myapp/delete_notif/{{ i.id }}" class="btn btn-outline-danger">Delete</a>
    </td>
  </tr>
    {% endfor %}
</table>
    </form>
{% endblock %}

</body>
</html>
